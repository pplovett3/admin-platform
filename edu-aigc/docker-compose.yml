services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATA_DIR: /data
      JWT_SECRET: ${JWT_SECRET:-please-change}
      DATA_KEY: ${DATA_KEY:-please-change}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_NAME: ${MODEL_NAME:-}
    volumes:
      - edu-data:/data

  postgres:
    profiles: ["infra"]
    image: postgres:14
    environment:
      POSTGRES_USER: edu
      POSTGRES_PASSWORD: edu
      POSTGRES_DB: edu
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./deploy/schema.postgres.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

  minio:
    profiles: ["infra"]
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: eduadmin
      MINIO_ROOT_PASSWORD: eduadmin-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  qdrant:
    profiles: ["infra"]
    image: qdrant/qdrant:v1.12.5
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

  rabbitmq:
    profiles: ["infra"]
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  edu-data:
  pg-data:
  minio-data:
  qdrant-data:
